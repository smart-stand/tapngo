
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>TapNGo</title>
</head>
<body>
<script>
(async function () {
  const id = new URLSearchParams(location.search).get("id");

  if (!/^\d{3}$/.test(id || "")) {
    document.body.textContent = "Invalid stand";
    return;
  }

  try {
    const script = document.createElement("script");
    script.src = "./links.js?t=" + Date.now();

    await new Promise((resolve, reject) => {
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });

    const url = window.TAPNGO_REDIRECTS?.[id];

    if (!url) {
  document.body.innerHTML =
    '<div style="font-family:Tahoma,Arial,sans-serif;text-align:center;padding:40px 20px;line-height:2;font-size:18px">' +
    'عميلنا العزيز، لتفعيل QR المنتج الخاص بك، برجاء إرسال الرابط الخاص بك على هذا الرقم:<br>' +
    '<a href="https://wa.me/201127248864" style="color:#25D366;font-weight:bold;font-size:22px;direction:ltr;display:inline-block">01127248864</a>' +
    '</div>';
  return;
}

    const destination = new URL(url);

    if (!["https:", "http:"].includes(destination.protocol)) {
      throw new Error("Invalid URL");
    }

    location.replace(destination.href);
  } catch {
    document.body.textContent =
      "Unable to open this link. Please try again.";
  }
})();
</script>
</body>
</html>
